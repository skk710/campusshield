<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusShield</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #12355b;
            color: white;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #12355b;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #12355b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2845;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #12355b;
        }
    </style>
</head>

<body>

<div class="navbar">
    CampusShield
</div>

<div class="container">

    <h1>Create Account</h1>

    <form action="/register" method="POST">

        <label for="name">Name</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your name"
               required>

        <label for="email">Email</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               required>

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="STUDENT">Student</option>
            <option value="OFFICER">Security Officer</option>
            <option value="ADMIN">Admin</option>
        </select>

        <button type="submit">Create Account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
