<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusShield</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #12355b;
            color: white;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #12355b;
        }

        p {
            font-size: 18px;
            color: #64748b;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #0d2845;
        }
    </style>
</head>

<body>

<div class="navbar">
    CampusShield
</div>

<div class="container">

    <h1>Campus Emergency Assistance</h1>

    <p>
        Smart campus emergency assistance and incident management system.
    </p>

    <a href="/report" class="button">Report an Incident</a>
</div>

</body>
</html>
