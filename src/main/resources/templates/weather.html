<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusShield - Weather</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .weather-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .brand {
            color: #1e3a8a;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 25px;
            color: #111827;
            font-size: 32px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #1e3a8a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172d6b;
        }

        .location {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .main-weather {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 15px 0 25px;
        }

        .icon {
            font-size: 70px;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            color: #111827;
        }

        .condition {
            font-size: 18px;
            color: #4b5563;
            margin-top: 3px;
        }

        .message {
            background: #eef4ff;
            border-left: 5px solid #2563eb;
            padding: 16px;
            border-radius: 10px;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .detail {
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-value {
            color: #111827;
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            background: #fff1f2;
            color: #be123c;
            padding: 15px;
            border-radius: 10px;
        }

        @media (max-width: 600px) {

            .weather-card {
                padding: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 42px;
            }
        }

    </style>

</head>

<body>

<div class="weather-card">

    <div class="brand">
        CAMPUSSHIELD
    </div>

    <h1>Campus Weather</h1>

    <form action="/weather"
          method="get"
          class="search-box">

        <input
                type="text"
                name="city"
                th:value="${city}"
                placeholder="Enter city"
                required>

        <button type="submit">
            Check Weather
        </button>

    </form>

    <div th:if="${weatherAvailable}">

        <div class="location"
             th:text="'📍 ' + ${city}">
        </div>

        <div class="main-weather">

            <div class="icon"
                 th:text="${icon}">
            </div>

            <div>

                <div class="temperature">
                    <span th:text="${#numbers.formatDecimal(temperature, 1, 1)}"></span>°C
                </div>

                <div class="condition"
                     th:text="${condition}">
                </div>

            </div>

        </div>

        <div class="message"
             th:text="${message}">
        </div>

        <div class="details">

            <div class="detail">

                <div class="detail-label">
                    FEELS LIKE
                </div>

                <div class="detail-value">
                    <span th:text="${#numbers.formatDecimal(feelsLike, 1, 1)}"></span>°C
                </div>

            </div>

            <div class="detail">

                <div class="detail-label">
                    HUMIDITY
                </div>

                <div class="detail-value">
                    <span th:text="${humidity}"></span>%
                </div>

            </div>

            <div class="detail">

                <div class="detail-label">
                    WIND
                </div>

                <div class="detail-value">
                    <span th:text="${#numbers.formatDecimal(windSpeed, 1, 1)}"></span> m/s
                </div>

            </div>

        </div>

    </div>

    <div th:unless="${weatherAvailable}"
         class="error">

        <span th:text="${weatherError}">
        </span>

    </div>

</div>

</body>

</html>
